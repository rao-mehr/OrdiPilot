name: Validate Dropbox root migration
on:
  push:
    branches:
      - dropbox-structure-migration
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and Dropbox destinations
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('index.html','utf8');
          for(const m of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)){
            if(!/src=/.test(m[1]))new vm.Script(m[2]);
          }
          new vm.Script(fs.readFileSync('service-worker.js','utf8'));
          for(const file of ['EasyPark_Automation_V2.gs','EasyPark_Automation_V3.gs','EasyPark_Automation_V4_5_Migrated.gs']){
            new vm.Script(fs.readFileSync(file,'utf8'));
          }
          const root='/Ordination & Selbständigkeit/Vertretungsdienste';
          for(const suffix of ['/System/daten.json','/System/Import/easypark.json','/Honorarnoten','/Parkbelege'])assert(html.includes(root+suffix));
          assert(html.includes('v6104-root-migration'));
          console.log('Dropbox migration validation passed');
          JS
