name: Validate OrdiPilot release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and canonical Dropbox paths
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const root='/Ordination & Selbständigkeit/Vertretungsdienste';
          const html=fs.readFileSync('index.html','utf8');
          for(const m of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)){
            if(!/src=/.test(m[1])) new vm.Script(m[2]);
          }
          const sw=fs.readFileSync('service-worker.js','utf8');
          new vm.Script(sw);
          const hotfix=fs.readFileSync('v6113-hotfix.js','utf8');
          const v3=fs.readFileSync('EasyPark_Automation_V3.gs','utf8');
          new vm.Script(hotfix);
          new vm.Script(v3);

          for(const suffix of ['/System/daten.json','/System/Import/easypark.json','/Honorarnoten','/Parkbelege']){
            assert(html.includes(root+suffix), `Missing canonical Dropbox path: ${root+suffix}`);
          }
          assert(hotfix.includes(root+'/System/daten.json'), 'Hotfix Dropbox fallback is not migrated');
          assert(v3.includes(root+'/System/Import/easypark.json'), 'EasyPark V3 index is not migrated');
          assert(html.includes('/Vertretungsdienste/03 Parkbelege'), 'Legacy parking compatibility missing');
          assert(hotfix.includes('SYNC_GUARD_EMPTY_MERGE'), 'Dropbox data-loss guard missing');
          assert(html.includes('vertretungsabrechnung-v3'), 'Stable localStorage key missing');
          console.log('OrdiPilot release validation passed');
          JS
