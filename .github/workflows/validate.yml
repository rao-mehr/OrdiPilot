name: Validate OrdiPilot release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Update-Pfad-Test braucht den Stand 6.11.3 (fa3bdf5)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prüfwerkzeuge installieren (fest versioniert)
        run: npm ci --no-audit --no-fund
      - name: Einheitliche Formatierung
        run: npx prettier --check "js/*.js" "css/*.css"
      - name: Statische Prüfung (undefinierte Namen, toter Code, doppelte Handler)
        run: node tests/static_check.mjs
      - name: Unit- und Release-Tests (Sync-Kern, Struktur, Datenschutz)
        run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser installieren
        run: |
          pip install playwright==1.* pypdf
          python -m playwright install --with-deps chromium
      - name: Browser-Test der ganzen App mit simulierter Dropbox
        run: python tests/browser_smoke.py
      - name: Charakterisierung (Verhalten unverändert)
        run: python tests/characterize.py
